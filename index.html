<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Barcode Scanner</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background-color: #f4f4f4; margin: 0; }
        /* Belangrijk: Geef de container een vaste of minimale hoogte om 'sprongen' te voorkomen */
        #reader { width: 100%; max-width: 500px; margin: auto; background: black; border-radius: 8px; overflow: hidden; min-height: 250px; }
        #result { margin-top: 20px; font-weight: bold; color: #333; font-size: 1.2em; padding: 15px; background: #e0f7fa; border-radius: 5px; display: inline-block; min-width: 200px; }
    </style>
</head>
<body>

    <h1>Scanner Actief</h1>
    <div id="reader"></div>
    <div id="result">Laden van camera...</div>

    <script>
        // Initialiseer de scanner zonder UI (Html5Qrcode ipv Html5QrcodeScanner)
        const html5QrCode = new Html5Qrcode("reader");
        
        const config = { 
            fps: 10, 
            qrbox: { width: 300, height: 150 }, // Geoptimaliseerd voor barcodes
            aspectRatio: 1.0 
        };

        const onScanSuccess = (decodedText, decodedResult) => {
            document.getElementById('result').innerText = "Gescand: " + decodedText;
            document.getElementById('result').style.backgroundColor = "#c8e6c9"; // Groen bij succes
            console.log("Code:", decodedText);
        };

        // Start direct de achtercamera
        html5QrCode.start(
            { facingMode: "environment" }, 
            config, 
            onScanSuccess
        ).then(() => {
            document.getElementById('result').innerText = "Scan een barcode...";
        }).catch((err) => {
            document.getElementById('result').innerText = "Fout bij starten: " + err;
            console.error("Camera start error:", err);
        });
    </script>
</body>
</html>
